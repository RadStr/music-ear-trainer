      grid-column: 1 / -1;
      margin: 0;
      max-width: 760px;
      width: 100%;
    }
    .envelope-preview svg {
      display: block;
      height: auto;
      width: 100%;
    }
    .envelope-preview figcaption {
      color: #5f6368;
      font-size: 0.9rem;
    }
    .envelope-chart-axis {
      stroke: #5f6368;
      stroke-width: 1;
    }
    .envelope-chart-grid {
      stroke: #dadce0;
      stroke-dasharray: 3 3;
      stroke-width: 1;
    }
    .envelope-chart-curve {
      fill: none;
      stroke: #d93025;
      stroke-linejoin: round;
      stroke-width: 3;
    }
    .envelope-chart-label {
      fill: #3c4043;
      font: 12px system-ui, sans-serif;
    }
  `;
    document.head.append(styles);
    const element = document.createElement("div");
    element.className = "envelope-editor";
    const toggleButton = document.createElement("button");
    toggleButton.type = "button";
    toggleButton.textContent = "Edit envelope";
    toggleButton.setAttribute("aria-expanded", "false");
    toggleButton.setAttribute("aria-controls", "envelope-controls");
    const controls = document.createElement("fieldset");
    controls.className = "envelope-controls";
    controls.id = "envelope-controls";
    controls.hidden = true;
    const legend = document.createElement("legend");
    legend.textContent = "ADSR envelope";
    const controlGrid = document.createElement("div");
    controlGrid.className = "envelope-controls-grid";
    controls.append(legend, controlGrid);
    const figure = document.createElement("figure");
    figure.className = "envelope-preview";
    const chart = createSvgElement("svg", {
      viewBox: "0 0 720 250",
      role: "img",
      "aria-labelledby": "envelope-chart-title envelope-chart-description"
    });
    const chartTitle = createSvgElement(
      "title",
      { id: "envelope-chart-title" },
      "ADSR envelope preview"
    );
    const chartDescription = createSvgElement(
      "desc",
      { id: "envelope-chart-description" },
      "A graph of the attack, decay, one-second sustain preview, and release stages."
    );
    const chartGrid = createSvgElement("line", {
      x1: String(CHART_LEFT),
      y1: String(CHART_TOP),
      x2: String(CHART_RIGHT),
      y2: String(CHART_TOP),
      class: "envelope-chart-grid"
    });
    const xAxis = createSvgElement("line", {
      x1: String(CHART_LEFT),
      y1: String(CHART_BOTTOM),
      x2: String(CHART_RIGHT),
      y2: String(CHART_BOTTOM),
      class: "envelope-chart-axis"
    });
    const yAxis = createSvgElement("line", {
      x1: String(CHART_LEFT),
      y1: String(CHART_TOP),
      x2: String(CHART_LEFT),
      y2: String(CHART_BOTTOM),
      class: "envelope-chart-axis"
    });
    const curve = createSvgElement("path", {
      class: "envelope-chart-curve"
    });
    const maximumLevelLabel = createSvgElement(
      "text",
      {
        x: String(CHART_LEFT - 10),
        y: String(CHART_TOP + 4),
        "text-anchor": "end",
        class: "envelope-chart-label"
      },
      "1.0"
    );
    const minimumLevelLabel = createSvgElement(
      "text",
      {
        x: String(CHART_LEFT - 10),
        y: String(CHART_BOTTOM + 4),
        "text-anchor": "end",
        class: "envelope-chart-label"
      },
      "0"
    );
    const startTimeLabel = createSvgElement(
      "text",
      {
        x: String(CHART_LEFT),
        y: String(CHART_BOTTOM + 20),
        class: "envelope-chart-label"
      },
      "0 s"
    );
    const totalTimeLabel = createSvgElement("text", {
      x: String(CHART_RIGHT),
      y: String(CHART_BOTTOM + 20),
      "text-anchor": "end",
      class: "envelope-chart-label"
    });
    const xAxisLabel = createSvgElement(
      "text",
      {
        x: String((CHART_LEFT + CHART_RIGHT) / 2),
        y: "244",
        "text-anchor": "middle",
        class: "envelope-chart-label"
      },
      "Time (seconds)"
    );
    chart.append(
      chartTitle,
      chartDescription,
      chartGrid,
      xAxis,
      yAxis,
      curve,
      maximumLevelLabel,
      minimumLevelLabel,
      startTimeLabel,
      totalTimeLabel,
      xAxisLabel
    );
    const caption = document.createElement("figcaption");
    caption.textContent = "Preview includes a 1-second sustain hold; during playback, sustain lasts while the mouse is held.";
    figure.append(chart, caption);
    controls.append(figure);
    element.append(toggleButton, controls);
    let changeHandler = () => {
    };
    function readValues(reportValidity) {
      const numberInputs = [
        attackControl.numberInput,
        decayControl.numberInput,
        sustainControl.numberInput,
        releaseControl.numberInput
      ];
      for (const input of numberInputs) {
        if (!input.validity.valid) {
          if (reportValidity) {
            input.reportValidity();
          }
          return void 0;
        }
      }
      return {
        attack: attackControl.numberInput.valueAsNumber,
        decay: decayControl.numberInput.valueAsNumber,
        sustain: sustainControl.numberInput.valueAsNumber,
        release: releaseControl.numberInput.valueAsNumber
      };
    }
    function updateChart() {
      const envelope = readValues(false);
      if (!envelope) {
        return;
      }
      const totalTime = envelope.attack + envelope.decay + PREVIEW_SUSTAIN_HOLD_SECONDS + envelope.release;
      const xForTime = (time) => CHART_LEFT + time / totalTime * CHART_WIDTH;
      const yForLevel = (level) => CHART_BOTTOM - level * CHART_HEIGHT;
      const attackEndX = xForTime(envelope.attack);
      const decayEndX = xForTime(envelope.attack + envelope.decay);
      const releaseStartX = xForTime(
        envelope.attack + envelope.decay + PREVIEW_SUSTAIN_HOLD_SECONDS
      );
      const sustainY = yForLevel(envelope.sustain);
      curve.setAttribute(
        "d",
        [
          `M ${CHART_LEFT} ${CHART_BOTTOM}`,
          `L ${attackEndX} ${CHART_TOP}`,
          `L ${decayEndX} ${sustainY}`,
          `L ${releaseStartX} ${sustainY}`,
          `L ${CHART_RIGHT} ${CHART_BOTTOM}`
        ].join(" ")
      );
      totalTimeLabel.textContent = `Total: ${totalTime.toFixed(2)} s`;
    }
    function addControl(id, labelText, initialValue, max) {
      const control = document.createElement("div");
      control.className = "envelope-control";
      const label = document.createElement("label");
      label.htmlFor = id;
      label.textContent = labelText;
      const numberInput = document.createElement("input");
      numberInput.id = id;
      numberInput.type = "number";
      numberInput.min = "0";
      numberInput.max = max;
      numberInput.step = "0.01";
      numberInput.value = initialValue;
      numberInput.required = true;
      label.append(numberInput);
      const rangeInput = document.createElement("input");
      rangeInput.id = `${id}-slider`;
      rangeInput.type = "range";
      rangeInput.min = "0";
      rangeInput.max = max;
      rangeInput.step = "0.01";
      rangeInput.value = initialValue;
      rangeInput.setAttribute("aria-label", `${labelText} slider`);
      numberInput.addEventListener("input", (_event) => {
        if (!numberInput.validity.valid) {
          changeHandler(void 0);
          return;
        }
        rangeInput.value = numberInput.value;
        updateChart();
        changeHandler(readValues(false));
      });
      rangeInput.addEventListener("input", (_event) => {
        numberInput.value = rangeInput.value;
        updateChart();
        changeHandler(readValues(false));
      });
      control.append(label, rangeInput);
      controlGrid.append(control);
      return { numberInput, rangeInput };
    }
    const attackControl = addControl(
      "envelope-attack",
      "Attack (seconds)",
      "0.05",
      "5"
    );
    const decayControl = addControl(
      "envelope-decay",
      "Decay (seconds)",
      "0.1",
      "5"
    );
    const sustainControl = addControl(
      "envelope-sustain",
      "Sustain (0\u20131)",
      "0.7",
      "1"
    );
    const releaseControl = addControl(
      "envelope-release",
      "Release (seconds)",
      "0",
      "5"
    );
    toggleButton.addEventListener("click", (_event) => {
      controls.hidden = !controls.hidden;
      toggleButton.setAttribute("aria-expanded", String(!controls.hidden));
    });
    updateChart();
    return {
      element,
      setChangeHandler: (handler) => {
        changeHandler = handler;
      },
      setEnvelope: (envelope) => {
        attackControl.numberInput.value = String(envelope.attack);
        attackControl.rangeInput.value = String(envelope.attack);
        decayControl.numberInput.value = String(envelope.decay);
        decayControl.rangeInput.value = String(envelope.decay);
        sustainControl.numberInput.value = String(envelope.sustain);
        sustainControl.rangeInput.value = String(envelope.sustain);
        releaseControl.numberInput.value = String(envelope.release);
        releaseControl.rangeInput.value = String(envelope.release);
        updateChart();
        changeHandler(envelope);
      },
      readEnvelope: () => readValues(true)
    };
  }

  // main.ts
  var envelopeView = createEnvelopeView();
  var envelopeController = new EnvelopeController(
    envelopeView,
    DEFAULT_ENVELOPE
  );
  var appView = createAppView(envelopeView);
  var noteSequenceView = createNoteSequenceView();
  var chordGameView = createPitchIdentificationView(
    "chords",
    "Chord and notes guessing",
    "Choose a mode: identify a chord name, click the chord notes in any order, or identify three random notes.",
    CHORDS
  );
  var scaleGameView = createPitchIdentificationView(
    "scales",
    "Scale guessing",
    "Choose a mode: identify the scale name or click each scale note on the keyboard in order.",
    SCALES
  );
  appView.element.append(noteSequenceView.element);
  appView.element.append(chordGameView.element, scaleGameView.element);
  var appController = new AppController(
    appView,
    envelopeController,
    new MetaAudioController(),
    new CustomAudioController()
  );
  var noteSequenceController = new NoteSequenceController(
    noteSequenceView,
    (midiNote, envelope) => appController.playNote(midiNote, envelope)
  );
  var chordGameController = new PitchIdentificationController(
    chordGameView,
    "chords",
    CHORDS,
    (midiNote, envelope) => appController.playNote(midiNote, envelope)
  );
  var scaleGameController = new PitchIdentificationController(
    scaleGameView,
    "scales",
    SCALES,
    (midiNote, envelope) => appController.playNote(midiNote, envelope)
  );
  var showGame = (gameView) => {
    noteSequenceController.resetGame();
    chordGameController.resetGame();
    scaleGameController.resetGame();
    appView.keyboardScreen.hidden = true;
    noteSequenceView.element.hidden = true;
    chordGameView.element.hidden = true;
    scaleGameView.element.hidden = true;
    gameView.hidden = false;
  };
  appView.gameButton.addEventListener("click", () => showGame(noteSequenceView.element));
  appView.chordGameButton.addEventListener("click", () => showGame(chordGameView.element));
  appView.scaleGameButton.addEventListener("click", () => showGame(scaleGameView.element));
  var returnToKeyboard = () => {
    noteSequenceController.resetGame();
    chordGameController.resetGame();
    scaleGameController.resetGame();
    noteSequenceView.element.hidden = true;
    chordGameView.element.hidden = true;
    scaleGameView.element.hidden = true;
    appView.keyboardScreen.hidden = false;
  };
  noteSequenceView.backButton.addEventListener("click", returnToKeyboard);
  chordGameView.backButton.addEventListener("click", returnToKeyboard);
  scaleGameView.backButton.addEventListener("click", returnToKeyboard);
})();

    </script>
  </body>
